<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRON SIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<style>
  /* ============ WEATHERED ARCADE AESTHETIC ============ */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #0d0a08;
    color: #e8d8b8;
    font-family: 'Press Start 2P', monospace;
    cursor: none;
  }
  #video {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
    filter: brightness(0.55) contrast(1.05) saturate(0.65) sepia(0.18);
    z-index: 1;
  }
  /* Slight vignette over video to push toward "weathered cabinet glass" */
  .vignette {
    position: absolute; inset: 0; z-index: 2; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(0,0,0,0.65) 100%);
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #poseCanvas { z-index: 3; opacity: 0; }
  #gameCanvas { z-index: 4; }
  #uiCanvas   { z-index: 5; }
  /* Scanline overlay - thin dark stripes, subtle */
  .scanlines {
    position: fixed; inset: 0;
    z-index: 50; pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.0) 0px,
      rgba(0,0,0,0.0) 2px,
      rgba(0,0,0,0.22) 3px,
      rgba(0,0,0,0.22) 4px
    );
    mix-blend-mode: multiply;
  }
  /* Faint horizontal CRT band that drifts very slowly */
  .crtband {
    position: fixed; inset: 0; z-index: 51; pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.04) 50%, rgba(255,255,255,0) 100%);
    background-size: 100% 14px;
    animation: drift 9s linear infinite;
    opacity: 0.5;
  }
  @keyframes drift {
    0%   { background-position: 0 -200px; }
    100% { background-position: 0 1080px; }
  }
  #startOverlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(8,6,4,0.92);
    z-index: 999;
    cursor: pointer;
    text-align: center;
    user-select: none;
  }
  #startOverlay h1 {
    font-size: 48px;
    letter-spacing: 8px;
    color: #e8d8b8;
    margin: 0 0 14px 0;
    text-shadow: 2px 2px 0 #2a1f18;
  }
  #startOverlay h2 {
    font-size: 12px;
    color: #8a7a5e;
    margin: 0 0 60px 0;
    letter-spacing: 4px;
  }
  #startOverlay p {
    font-size: 14px;
    color: #c8b890;
    margin: 8px 0;
    letter-spacing: 2px;
  }
  #startOverlay .blink {
    margin-top: 50px;
    font-size: 16px;
    color: #E8C16A;
    animation: blink 1.1s steps(2, jump-none) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .frame {
    position: fixed;
    inset: 8px;
    z-index: 60;
    pointer-events: none;
    border: 3px solid #3a2f24;
    box-shadow:
      inset 0 0 0 1px #5a4a3a,
      inset 0 0 30px rgba(0,0,0,0.5);
  }
</style>
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <div class="vignette"></div>
  <canvas id="poseCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
  <canvas id="uiCanvas"></canvas>
  <div class="frame"></div>
  <div class="scanlines"></div>
  <div class="crtband"></div>

  <div id="startOverlay">
    <h1>IRON SIGHT</h1>
    <h2>// DUAL WEBCAM SHOOTER //</h2>
    <p>TWO PLAYERS. ONE CAMERA.</p>
    <p>RAISE A HAND TO AIM.</p>
    <p>PINCH THUMB AND INDEX TO FIRE.</p>
    <p>BEST OF THREE ROUNDS.</p>
    <div class="blink">CLICK TO BEGIN</div>
  </div>

<script>
/* =========================================================================
   IRON SIGHT — single-file webcam shooter
   ========================================================================= */

// ---------- Constants ----------
const P1_COLOR        = '#E8C16A';   // warm amber
const P2_COLOR        = '#7EC8A4';   // sage green
const INK             = '#e8d8b8';   // ivory text
const INK_DIM         = '#8a7a5e';   // muted ivory
const METAL_DARK      = '#2a1f18';
const METAL_FRAME     = '#5a4a3a';
const HIT_RADIUS      = 70;          // px
const BULLET_SPEED    = 1500;        // px/s
const BULLET_LIFETIME = 0.4;         // s
const SHOOT_COOLDOWN  = 800;         // ms
const PINCH_THRESHOLD = 40;          // px
const FLASH_DURATION  = 0.09;        // s
const ROUND_INTRO_T   = 3.0;         // s
const ROUND_END_T     = 3.0;         // s

// ---------- DOM / Canvas ----------
const video       = document.getElementById('video');
const gameCanvas  = document.getElementById('gameCanvas');
const uiCanvas    = document.getElementById('uiCanvas');
const poseCanvas  = document.getElementById('poseCanvas');
const startOverlay= document.getElementById('startOverlay');
const gctx = gameCanvas.getContext('2d', { willReadFrequently: true });
const uctx = uiCanvas.getContext('2d',   { willReadFrequently: true });
const pctx = poseCanvas.getContext('2d', { willReadFrequently: true });

let W = window.innerWidth;
let H = window.innerHeight;

function resizeAll() {
  W = window.innerWidth; H = window.innerHeight;
  for (const c of [gameCanvas, uiCanvas, poseCanvas]) {
    c.width = W; c.height = H;
  }
  if (gestureEngine) gestureEngine.resize(W, H);
  uiDirty = true;
}
window.addEventListener('resize', resizeAll);

/* =========================================================================
   GestureEngine
   - Reads MediaPipe Hands results
   - Assigns hands to player slots based on mirrored x position
   - Maps wrist (landmark 0) to canvas coords (mirrored)
   - Detects pinch: thumb_tip(4) <-> index_tip(8) Euclidean dist < threshold
   - Edge-triggered fire (must un-pinch between shots)
   ========================================================================= */
class GestureEngine {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.handsResults = null;
    this.wasPinching  = { p1: false, p2: false };
    this.players = {
      p1: { aim: { x: w * 0.25, y: h * 0.5 }, fire: false, handsVisible: false, lastSeen: 0 },
      p2: { aim: { x: w * 0.75, y: h * 0.5 }, fire: false, handsVisible: false, lastSeen: 0 }
    };
  }
  resize(w, h) { this.w = w; this.h = h; }
  setHandsResults(r) { this.handsResults = r; }

  // Mirror-x because video is CSS-flipped horizontally
  mx(nx) { return (1 - nx) * this.w; }
  my(ny) { return ny * this.h; }

  update(now) {
    // Reset per-frame transient flags
    this.players.p1.fire = false;
    this.players.p2.fire = false;
    this.players.p1.handsVisible = false;
    this.players.p2.handsVisible = false;

    const r = this.handsResults;
    if (!r || !r.multiHandLandmarks || r.multiHandLandmarks.length === 0) {
      // No hands: clear pinch state so next sighting can fire fresh
      this.wasPinching.p1 = false;
      this.wasPinching.p2 = false;
      return;
    }

    // Bin hands by mirrored x: < 0.5 -> P1 (screen-left), >= 0.5 -> P2 (screen-right)
    const p1Hands = [];
    const p2Hands = [];
    for (let i = 0; i < r.multiHandLandmarks.length; i++) {
      const lm = r.multiHandLandmarks[i];
      const wrist = lm[0];
      const mirX = 1 - wrist.x;
      if (mirX < 0.5) p1Hands.push(lm);
      else            p2Hands.push(lm);
    }

    // Pick the "best" hand per player (prefer the one with widest span -> closer to camera)
    const pickBest = (hands) => {
      if (hands.length === 0) return null;
      if (hands.length === 1) return hands[0];
      let best = hands[0], bestSpan = -1;
      for (const lm of hands) {
        let minX = 1, maxX = 0, minY = 1, maxY = 0;
        for (const p of lm) {
          if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y;
        }
        const span = (maxX - minX) + (maxY - minY);
        if (span > bestSpan) { bestSpan = span; best = lm; }
      }
      return best;
    };

    const processPlayer = (key, hands) => {
      const lm = pickBest(hands);
      const p  = this.players[key];
      if (!lm) {
        this.wasPinching[key] = false;
        return;
      }
      p.handsVisible = true;
      p.lastSeen = now;

      // Aim from wrist (landmark 0)
      const wrist = lm[0];
      const ax = this.mx(wrist.x);
      const ay = this.my(wrist.y);
      // Smooth aim a touch (low-pass)
      p.aim.x = p.aim.x + (ax - p.aim.x) * 0.45;
      p.aim.y = p.aim.y + (ay - p.aim.y) * 0.45;

      // Pinch detection: distance in pixel space
      const thumb = lm[4];
      const index = lm[8];
      const tx = this.mx(thumb.x), ty = this.my(thumb.y);
      const ix = this.mx(index.x), iy = this.my(index.y);
      const dx = tx - ix, dy = ty - iy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const pinching = dist < PINCH_THRESHOLD;

      // Edge trigger: only fire on transition non-pinch -> pinch
      if (pinching && !this.wasPinching[key]) p.fire = true;
      this.wasPinching[key] = pinching;
    };

    processPlayer('p1', p1Hands);
    processPlayer('p2', p2Hands);
  }
}

/* =========================================================================
   AudioEngine
   - Procedural sounds, all from Web Audio API
   - Unlocked on first user gesture
   ========================================================================= */
class AudioEngine {
  constructor() { this.ctx = null; this.unlocked = false; }
  unlock() {
    if (this.unlocked) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.unlocked = true;
    } catch (e) { /* no audio */ }
  }
  // Short noise burst, lowpass-filtered
  shoot() {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const dur = 0.08;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource();
    src.buffer = buf;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    filter.Q.value = 0.7;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.55, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    src.connect(filter); filter.connect(gain); gain.connect(ctx.destination);
    src.start();
    src.stop(ctx.currentTime + dur + 0.02);
  }
  // Sine sweep 440 -> 180 with mild waveshaper distortion
  hit() {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const dur = 0.15;
    const osc = ctx.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + dur);
    const shaper = ctx.createWaveShaper();
    const curve = new Float32Array(512);
    for (let i = 0; i < 512; i++) {
      const x = (i / 511) * 2 - 1;
      curve[i] = Math.tanh(x * 2.5);
    }
    shaper.curve = curve;
    shaper.oversample = '2x';
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.45, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(shaper); shaper.connect(gain); gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.02);
  }
  // Three descending square tones, 200ms each
  roundEnd() {
    if (!this.ctx) return;
    const ctx = this.ctx;
    const tones = [330, 247, 165];
    tones.forEach((freq, i) => {
      const t = ctx.currentTime + i * 0.21;
      const osc = ctx.createOscillator();
      osc.type = 'square';
      osc.frequency.value = freq;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.01);
      gain.gain.linearRampToValueAtTime(0.0, t + 0.20);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + 0.22);
    });
  }
}

/* =========================================================================
   ParticleSystem - 4-pixel white square bursts
   ========================================================================= */
class ParticleSystem {
  constructor() { this.particles = []; }
  burst(x, y) {
    for (let i = 0; i < 4; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 90 + Math.random() * 160;
      this.particles.push({
        x, y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        life: 0.45,
        maxLife: 0.45
      });
    }
  }
  update(dt) {
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x  += p.vx * dt;
      p.y  += p.vy * dt;
      p.vy += 240 * dt;     // a touch of gravity
      p.vx *= 0.96;         // air drag
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
  }
  render(ctx) {
    ctx.save();
    for (const p of this.particles) {
      const a = Math.max(0, Math.min(1, p.life / p.maxLife));
      ctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
      const x = Math.round(p.x) - 2;
      const y = Math.round(p.y) - 2;
      ctx.fillRect(x, y, 4, 4);
    }
    ctx.restore();
  }
}

/* =========================================================================
   BulletManager
   - Spawns at shooter aim, locks velocity vector toward opponent aim at fire time
   - Hit detection vs OPPONENT'S CURRENT aim (so dodging works)
   - Lifetime cap; on hit triggers callback, particle burst, hit sound
   ========================================================================= */
class BulletManager {
  constructor(particles, audio, onHit) {
    this.bullets = [];
    this.particles = particles;
    this.audio = audio;
    this.onHit = onHit;
  }
  spawn(owner, sx, sy, tx, ty) {
    const dx = tx - sx, dy = ty - sy;
    const len = Math.sqrt(dx * dx + dy * dy) || 1;
    this.bullets.push({
      owner,
      x: sx, y: sy,
      px: sx, py: sy,
      vx: (dx / len) * BULLET_SPEED,
      vy: (dy / len) * BULLET_SPEED,
      life: BULLET_LIFETIME
    });
  }
  clear() { this.bullets.length = 0; }
  update(dt, players) {
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.px = b.x; b.py = b.y;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;

      // Off-screen: cull early
      if (b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) {
        this.bullets.splice(i, 1);
        continue;
      }

      const targetKey = b.owner === 'p1' ? 'p2' : 'p1';
      const t = players[targetKey];
      if (t && t.handsVisible) {
        const ddx = b.x - t.aim.x;
        const ddy = b.y - t.aim.y;
        if ((ddx * ddx + ddy * ddy) < HIT_RADIUS * HIT_RADIUS) {
          this.particles.burst(t.aim.x, t.aim.y);
          this.audio.hit();
          this.onHit(targetKey);
          this.bullets.splice(i, 1);
          continue;
        }
      }

      if (b.life <= 0) this.bullets.splice(i, 1);
    }
  }
  render(ctx) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineWidth = 2;
    for (const b of this.bullets) {
      // Streak from a short distance behind toward current pos
      const dx = b.vx, dy = b.vy;
      const sp = Math.sqrt(dx * dx + dy * dy) || 1;
      const trail = 26;
      const ex = b.x - (dx / sp) * trail;
      const ey = b.y - (dy / sp) * trail;
      const grad = ctx.createLinearGradient(ex, ey, b.x, b.y);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(1, 'rgba(255,255,255,0.95)');
      ctx.strokeStyle = grad;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      // Tip pixel
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(Math.round(b.x) - 2, Math.round(b.y) - 2, 4, 4);
    }
    ctx.restore();
  }
}

/* =========================================================================
   GameState
   ========================================================================= */
const gameState = {
  lives:        { p1: 3, p2: 3 },
  rounds:       { p1: 0, p2: 0 },
  currentRound: 1,
  phase:        'idle',  // 'idle' | 'roundIntro' | 'playing' | 'roundEnd' | 'matchEnd'
  phaseTimer:   0,
  lastShot:     { p1: 0, p2: 0 },
  flashTimer:   0,
  matchWinner:  null,
  lastRoundWinner: null
};

let uiDirty = true;
const uiState = {
  phase: '', livesP1: -1, livesP2: -1,
  roundsP1: -1, roundsP2: -1, round: -1,
  p1Hands: null, p2Hands: null,
  matchWinner: null, lastRoundWinner: null
};

function startMatch() {
  gameState.lives  = { p1: 3, p2: 3 };
  gameState.rounds = { p1: 0, p2: 0 };
  gameState.currentRound = 1;
  gameState.phase = 'roundIntro';
  gameState.phaseTimer = ROUND_INTRO_T;
  gameState.matchWinner = null;
  gameState.lastRoundWinner = null;
  bullets.clear();
  particles.particles.length = 0;
  uiDirty = true;
}

function nextRoundOrMatchEnd() {
  if (gameState.rounds.p1 >= 2) {
    gameState.matchWinner = 'p1';
    gameState.phase = 'matchEnd';
  } else if (gameState.rounds.p2 >= 2) {
    gameState.matchWinner = 'p2';
    gameState.phase = 'matchEnd';
  } else {
    gameState.currentRound++;
    gameState.lives.p1 = 3;
    gameState.lives.p2 = 3;
    gameState.phase = 'roundIntro';
    gameState.phaseTimer = ROUND_INTRO_T;
    bullets.clear();
  }
  uiDirty = true;
}

function onHit(targetKey) {
  if (gameState.phase !== 'playing') return;
  gameState.lives[targetKey] = Math.max(0, gameState.lives[targetKey] - 1);
  gameState.flashTimer = FLASH_DURATION;
  uiDirty = true;
  if (gameState.lives[targetKey] <= 0) {
    const winner = targetKey === 'p1' ? 'p2' : 'p1';
    gameState.rounds[winner]++;
    gameState.lastRoundWinner = winner;
    gameState.phase = 'roundEnd';
    gameState.phaseTimer = ROUND_END_T;
    audio.roundEnd();
  }
}

/* =========================================================================
   Engines / Singletons
   ========================================================================= */
const audio          = new AudioEngine();
const particles      = new ParticleSystem();
const bullets        = new BulletManager(particles, audio, onHit);
const gestureEngine  = new GestureEngine(W, H);

/* =========================================================================
   Game Loop (rAF, fixed delta clamp)
   ========================================================================= */
let lastTime = performance.now();

function gameLoop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  // ---- Update ----
  gestureEngine.update(now);
  particles.update(dt);

  if (gameState.phase === 'playing') {
    bullets.update(dt, gestureEngine.players);

    for (const key of ['p1', 'p2']) {
      const p = gestureEngine.players[key];
      const oppKey = key === 'p1' ? 'p2' : 'p1';
      const op = gestureEngine.players[oppKey];
      if (p.fire && p.handsVisible && (now - gameState.lastShot[key] >= SHOOT_COOLDOWN)) {
        gameState.lastShot[key] = now;
        bullets.spawn(key, p.aim.x, p.aim.y, op.aim.x, op.aim.y);
        audio.shoot();
      }
    }
  } else if (gameState.phase === 'roundIntro') {
    gameState.phaseTimer -= dt;
    if (gameState.phaseTimer <= 0) {
      gameState.phase = 'playing';
      uiDirty = true;
    }
  } else if (gameState.phase === 'roundEnd') {
    gameState.phaseTimer -= dt;
    bullets.update(dt, gestureEngine.players); // let bullets fade naturally
    if (gameState.phaseTimer <= 0) nextRoundOrMatchEnd();
  }

  if (gameState.flashTimer > 0) gameState.flashTimer -= dt;

  // ---- Render ----
  renderGame();

  // UI canvas: redraw only when state hash changes (or transient overlays present)
  if (checkUIDirty() || gameState.phase === 'roundIntro' || gameState.phase === 'roundEnd' || gameState.phase === 'matchEnd') {
    renderUI();
    uiDirty = false;
  }

  requestAnimationFrame(gameLoop);
}

function checkUIDirty() {
  const p1H = gestureEngine.players.p1.handsVisible;
  const p2H = gestureEngine.players.p2.handsVisible;
  if (uiDirty
      || uiState.phase     !== gameState.phase
      || uiState.livesP1   !== gameState.lives.p1
      || uiState.livesP2   !== gameState.lives.p2
      || uiState.roundsP1  !== gameState.rounds.p1
      || uiState.roundsP2  !== gameState.rounds.p2
      || uiState.round     !== gameState.currentRound
      || uiState.p1Hands   !== p1H
      || uiState.p2Hands   !== p2H
      || uiState.matchWinner !== gameState.matchWinner
      || uiState.lastRoundWinner !== gameState.lastRoundWinner) {
    uiState.phase    = gameState.phase;
    uiState.livesP1  = gameState.lives.p1;
    uiState.livesP2  = gameState.lives.p2;
    uiState.roundsP1 = gameState.rounds.p1;
    uiState.roundsP2 = gameState.rounds.p2;
    uiState.round    = gameState.currentRound;
    uiState.p1Hands  = p1H;
    uiState.p2Hands  = p2H;
    uiState.matchWinner = gameState.matchWinner;
    uiState.lastRoundWinner = gameState.lastRoundWinner;
    return true;
  }
  return false;
}

/* =========================================================================
   Game Canvas Renderer
   ========================================================================= */
function renderGame() {
  gctx.clearRect(0, 0, W, H);

  // White flash on hit
  if (gameState.flashTimer > 0) {
    const a = (gameState.flashTimer / FLASH_DURATION) * 0.5;
    gctx.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`;
    gctx.fillRect(0, 0, W, H);
  }

  // Crosshairs (only during play phases)
  if (gameState.phase === 'playing' || gameState.phase === 'roundIntro' || gameState.phase === 'roundEnd') {
    if (gestureEngine.players.p1.handsVisible) {
      drawCrosshair(gctx, gestureEngine.players.p1.aim.x, gestureEngine.players.p1.aim.y, P1_COLOR);
      drawNameTag (gctx, 'P1', gestureEngine.players.p1.aim.x, gestureEngine.players.p1.aim.y, P1_COLOR);
    }
    if (gestureEngine.players.p2.handsVisible) {
      drawCrosshair(gctx, gestureEngine.players.p2.aim.x, gestureEngine.players.p2.aim.y, P2_COLOR);
      drawNameTag (gctx, 'P2', gestureEngine.players.p2.aim.x, gestureEngine.players.p2.aim.y, P2_COLOR);
    }
  }

  bullets.render(gctx);
  particles.render(gctx);
}

function drawCrosshair(ctx, x, y, color) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineWidth   = 2;
  ctx.beginPath();
  ctx.moveTo(x - 12, y);
  ctx.lineTo(x - 4,  y);
  ctx.moveTo(x + 4,  y);
  ctx.lineTo(x + 12, y);
  ctx.moveTo(x, y - 12);
  ctx.lineTo(x, y - 4);
  ctx.moveTo(x, y + 4);
  ctx.lineTo(x, y + 12);
  ctx.stroke();
  // Center pip
  ctx.fillStyle = color;
  ctx.fillRect(x - 1, y - 1, 2, 2);
  // Faint outer ring of tick marks (4 px squares at corners)
  ctx.fillRect(x - 13, y - 13, 2, 2);
  ctx.fillRect(x + 11, y - 13, 2, 2);
  ctx.fillRect(x - 13, y + 11, 2, 2);
  ctx.fillRect(x + 11, y + 11, 2, 2);
  ctx.restore();
}

function drawNameTag(ctx, text, x, y, color) {
  ctx.save();
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  // Backing slab
  const w = ctx.measureText(text).width;
  ctx.fillStyle = 'rgba(10,8,6,0.7)';
  ctx.fillRect(x - w / 2 - 4, y - 32, w + 8, 14);
  ctx.fillStyle = color;
  ctx.fillText(text, x, y - 22);
  ctx.restore();
}

/* =========================================================================
   UI Canvas Renderer
   ========================================================================= */
function renderUI() {
  uctx.clearRect(0, 0, W, H);

  drawHealthBar(uctx, 'p1', P1_COLOR, true);
  drawHealthBar(uctx, 'p2', P2_COLOR, false);
  drawTallies(uctx);
  drawMatchHeader(uctx);

  // "RAISE HANDS" warnings (only during playing phase)
  if (gameState.phase === 'playing') {
    if (!gestureEngine.players.p1.handsVisible) {
      drawWarning(uctx, 'RAISE HANDS', 30, 110, 'left');
    }
    if (!gestureEngine.players.p2.handsVisible) {
      drawWarning(uctx, 'RAISE HANDS', W - 30, 110, 'right');
    }
  }

  // Round intro overlay
  if (gameState.phase === 'roundIntro') {
    uctx.fillStyle = 'rgba(8,6,4,0.55)';
    uctx.fillRect(0, H / 2 - 80, W, 160);
    // top/bottom hairline
    uctx.fillStyle = METAL_FRAME;
    uctx.fillRect(0, H / 2 - 80, W, 2);
    uctx.fillRect(0, H / 2 + 78, W, 2);
    uctx.fillStyle = INK;
    uctx.font = `${Math.min(72, Math.floor(W / 14))}px "Press Start 2P", monospace`;
    uctx.textAlign = 'center';
    uctx.textBaseline = 'middle';
    uctx.fillText(`ROUND ${gameState.currentRound}`, W / 2, H / 2);
  }

  // Round end overlay
  if (gameState.phase === 'roundEnd') {
    uctx.fillStyle = 'rgba(8,6,4,0.55)';
    uctx.fillRect(0, H / 2 - 70, W, 140);
    uctx.fillStyle = METAL_FRAME;
    uctx.fillRect(0, H / 2 - 70, W, 2);
    uctx.fillRect(0, H / 2 + 68, W, 2);
    const winnerKey = gameState.lastRoundWinner;
    const color = winnerKey === 'p1' ? P1_COLOR : P2_COLOR;
    uctx.fillStyle = color;
    uctx.font = `${Math.min(40, Math.floor(W / 24))}px "Press Start 2P", monospace`;
    uctx.textAlign = 'center';
    uctx.textBaseline = 'middle';
    uctx.fillText(`${winnerKey ? winnerKey.toUpperCase() : ''} TAKES THE ROUND`, W / 2, H / 2);
  }

  // Match end overlay
  if (gameState.phase === 'matchEnd') {
    uctx.fillStyle = 'rgba(8,6,4,0.88)';
    uctx.fillRect(0, 0, W, H);
    // Border-ish band
    uctx.fillStyle = METAL_DARK;
    uctx.fillRect(0, H / 2 - 130, W, 260);
    uctx.strokeStyle = METAL_FRAME;
    uctx.lineWidth = 2;
    uctx.strokeRect(40, H / 2 - 130, W - 80, 260);

    const wKey  = gameState.matchWinner;
    const color = wKey === 'p1' ? P1_COLOR : P2_COLOR;
    uctx.fillStyle = color;
    uctx.font = `${Math.min(80, Math.floor(W / 12))}px "Press Start 2P", monospace`;
    uctx.textAlign = 'center';
    uctx.textBaseline = 'middle';
    uctx.fillText(`${wKey ? wKey.toUpperCase() : ''} WINS`, W / 2, H / 2 - 30);

    uctx.fillStyle = INK_DIM;
    uctx.font = '14px "Press Start 2P", monospace';
    uctx.fillText('PRESS  SPACE  TO  RESTART', W / 2, H / 2 + 50);

    uctx.fillStyle = INK_DIM;
    uctx.font = '10px "Press Start 2P", monospace';
    uctx.fillText('— GOOD GAME —', W / 2, H / 2 + 90);
  }
}

function drawHealthBar(ctx, key, color, leftSide) {
  const lives = gameState.lives[key];
  const segW = 22, segH = 32, gap = 5;
  const total = 3 * segW + 2 * gap;
  const margin = 30;
  const yTop = 36;
  const x = leftSide ? margin : W - margin - total;

  // Outer scratched-metal frame
  ctx.save();
  ctx.fillStyle = METAL_DARK;
  ctx.fillRect(x - 8, yTop - 8, total + 16, segH + 16);
  ctx.strokeStyle = METAL_FRAME;
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 8, yTop - 8, total + 16, segH + 16);

  // Scratches: a few short dim lines
  ctx.strokeStyle = 'rgba(232,216,184,0.08)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const sx = x - 6 + Math.random() * (total + 12);
    const sy = yTop - 6 + Math.random() * (segH + 12);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + 6 + Math.random() * 8, sy + (Math.random() * 2 - 1));
    ctx.stroke();
  }

  // LCD segments
  for (let i = 0; i < 3; i++) {
    const sx = x + i * (segW + gap);
    // Empty cell first (always)
    ctx.fillStyle = '#15100c';
    ctx.fillRect(sx, yTop, segW, segH);
    ctx.strokeStyle = '#3a2f24';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 0.5, yTop + 0.5, segW - 1, segH - 1);

    if (i < lives) {
      // Filled segment in player color, with subtle inner darker stripe to fake LCD pixels
      ctx.fillStyle = color;
      ctx.fillRect(sx + 2, yTop + 2, segW - 4, segH - 4);
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      for (let yy = yTop + 3; yy < yTop + segH - 3; yy += 3) {
        ctx.fillRect(sx + 2, yy, segW - 4, 1);
      }
    }
  }

  // Label
  ctx.fillStyle = INK;
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.textAlign = leftSide ? 'left' : 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(key.toUpperCase(), leftSide ? x - 6 : x + total + 6, yTop - 14);

  ctx.restore();
}

function drawTallies(ctx) {
  // Center top: round indicator + chalk tally for each player
  ctx.save();
  ctx.textBaseline = 'alphabetic';

  // P1 tallies (left of center)
  const cyTally = 64;
  drawChalkTally(ctx, gameState.rounds.p1, W / 2 - 110, cyTally, P1_COLOR);
  drawChalkTally(ctx, gameState.rounds.p2, W / 2 + 110, cyTally, P2_COLOR);

  // Labels
  ctx.fillStyle = P1_COLOR;
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('P1', W / 2 - 110, 32);
  ctx.fillStyle = P2_COLOR;
  ctx.fillText('P2', W / 2 + 110, 32);

  ctx.restore();
}

function drawChalkTally(ctx, count, cx, cy, color) {
  // Up to 2 marks (best of 3 -> max wins is 2 to clinch)
  const slotW = 16;
  const totalW = slotW * 2;
  const startX = cx - totalW / 2 + slotW / 2;
  ctx.save();
  ctx.lineCap = 'round';
  for (let i = 0; i < 2; i++) {
    const sx = startX + i * slotW;
    if (i < count) {
      ctx.strokeStyle = color;
      ctx.lineWidth = 3;
      // Slightly imperfect "chalk" line
      ctx.beginPath();
      ctx.moveTo(sx - 1, cy - 14);
      ctx.lineTo(sx + 3, cy + 14);
      ctx.stroke();
      // Faint cross-stroke whiff for character
      ctx.strokeStyle = 'rgba(255,255,255,0.10)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(sx - 4, cy - 4);
      ctx.lineTo(sx + 6, cy - 8);
      ctx.stroke();
    } else {
      // Empty slot: dim dot
      ctx.fillStyle = 'rgba(232,216,184,0.18)';
      ctx.fillRect(sx - 1, cy - 1, 2, 2);
    }
  }
  ctx.restore();
}

function drawMatchHeader(ctx) {
  ctx.save();
  ctx.fillStyle = INK_DIM;
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(`ROUND  ${gameState.currentRound}  /  3`, W / 2, 32);
  ctx.fillStyle = INK_DIM;
  ctx.fillRect(W / 2 - 80, 38, 160, 1);
  ctx.restore();

  // Title in corner: tiny brand
  ctx.save();
  ctx.fillStyle = INK_DIM;
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.textAlign = 'left';
  ctx.fillText('IRON  SIGHT  v1', 30, H - 26);
  ctx.textAlign = 'right';
  ctx.fillText('CAB-1987', W - 30, H - 26);
  ctx.restore();
}

function drawWarning(ctx, text, x, y, align) {
  ctx.save();
  ctx.font = '10px "Press Start 2P", monospace';
  ctx.textAlign = align;
  ctx.textBaseline = 'alphabetic';
  // Backing
  const w = ctx.measureText(text).width + 12;
  const bx = align === 'left' ? x - 6 : x - w + 6;
  ctx.fillStyle = 'rgba(40,20,10,0.7)';
  ctx.fillRect(bx, y - 12, w, 18);
  ctx.strokeStyle = '#7a4a2a';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx + 0.5, y - 11.5, w - 1, 17);
  // Text — pulse via wall-clock
  const pulse = 0.6 + 0.4 * Math.abs(Math.sin(performance.now() / 220));
  ctx.fillStyle = `rgba(232,160,80,${pulse.toFixed(3)})`;
  ctx.fillText(text, x, y);
  ctx.restore();
}

/* =========================================================================
   Bootstrap: getUserMedia -> Hands -> camera processing loop -> game loop
   ========================================================================= */
let hands = null;
let processingFrame = false;

async function startCameraAndPipeline() {
  resizeAll();

  // 1) Get webcam
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false
    });
  } catch (e) {
    showFatal('CAMERA  ACCESS  DENIED');
    return;
  }
  video.srcObject = stream;
  await new Promise((res) => {
    if (video.readyState >= 2) return res();
    video.onloadedmetadata = () => res();
  });
  try { await video.play(); } catch (e) { /* ignore */ }

  // 2) Init MediaPipe Hands
  if (typeof Hands === 'undefined') {
    showFatal('FAILED  TO  LOAD  MEDIAPIPE');
    return;
  }
  hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
  });
  hands.setOptions({
    maxNumHands: 4,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.5
  });
  hands.onResults((results) => {
    gestureEngine.setHandsResults(results);
  });

  // 3) Camera processing loop @ ~30fps, single in-flight inference
  const targetIntervalMs = 33;
  let lastSent = 0;
  const camStep = async () => {
    const t = performance.now();
    if (!processingFrame && video.readyState >= 2 && (t - lastSent) >= targetIntervalMs) {
      processingFrame = true;
      lastSent = t;
      try {
        await hands.send({ image: video });
      } catch (e) { /* swallow */ }
      processingFrame = false;
    }
    requestAnimationFrame(camStep);
  };
  requestAnimationFrame(camStep);

  // 4) Start match + game loop
  startMatch();
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
}

function showFatal(message) {
  startOverlay.style.display = 'flex';
  startOverlay.innerHTML = `
    <h1>IRON SIGHT</h1>
    <h2>// SYSTEM FAULT //</h2>
    <p style="color:#c87a4a">${message}</p>
    <p style="margin-top:30px;color:#8a7a5e">CHECK CAMERA PERMISSIONS AND RELOAD</p>
  `;
}

/* =========================================================================
   Input bindings
   ========================================================================= */
startOverlay.addEventListener('click', () => {
  audio.unlock();         // must run from user gesture
  startOverlay.style.display = 'none';
  startCameraAndPipeline();
}, { once: true });

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    if (gameState.phase === 'matchEnd') {
      startMatch();
    }
  }
});

// Safety: if the audio context was created but suspended (some browsers), resume on any later click
document.addEventListener('click', () => {
  if (audio.ctx && audio.ctx.state === 'suspended') {
    audio.ctx.resume().catch(() => {});
  }
});

/* =========================================================================
   Initial canvas sizing — done before user clicks start so overlays look right
   ========================================================================= */
resizeAll();
</script>
