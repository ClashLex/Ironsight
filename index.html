<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRON SIGHT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<!-- MediaPipe Hands SDK -->
<script defer src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<!-- Retro CRT cabinet styling -->
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <video id="video" playsinline autoplay muted></video>
  <div class="vignette"></div>
  <canvas id="poseCanvas"></canvas>
  <canvas id="gameCanvas"></canvas>
  <canvas id="uiCanvas"></canvas>
  <div class="frame"></div>
  <div class="scanlines"></div>
  <div class="crtband"></div>

  <!-- Start Game / Mode selector overlay -->
  <div id="startOverlay">
    <h1>IRON SIGHT</h1>
    <h2>// RETRO SHOOTER //</h2>
    <p>TWO PLAYERS. ONE CABINET.</p>
    <p><b>WEBCAM:</b> RAISE HANDS TO AIM & PINCH THUMB + INDEX TO FIRE.</p>
    <p><b>KEYBOARD:</b> P1 MOVES MOUSE (OR WASD) & CLICK (SPACE) TO FIRE.</p>
    <p>P2 MOVES WITH ARROW KEYS & FIRES WITH ENTER.</p>
    
    <div class="mode-buttons">
      <button id="webcamModeBtn" class="btn-arcade">PLAY WITH WEBCAM</button>
      <button id="keyboardModeBtn" class="btn-arcade green-theme">PLAY WITH KEYBOARD</button>
    </div>
    <div class="blink">SELECT MODE TO DEPLOY ACTION</div>
  </div>

  <!-- Main ES module entry script -->
  <script type="module">
    import { bootstrapGame } from '/src/main.js';
    bootstrapGame();
  </script>
</body>
</html>
